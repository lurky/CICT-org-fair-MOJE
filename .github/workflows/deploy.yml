name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release with CMS settings
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          CMS: ${{ vars.CMS }}
          CMS_URL: ${{ vars.CMS_URL }}
          CMS_SPACE: ${{ vars.CMS_SPACE }}
          CMS_PROJECT: ${{ vars.CMS_PROJECT }}
          CMS_DATASET: ${{ vars.CMS_DATASET }}
          CMS_TOKEN: ${{ secrets.CMS_TOKEN }}
        run: |
          test -n "$CMS" || { echo 'Set the CMS repository variable before deploying.'; exit 1; }
          flutter build web --release \
            --base-href "/$REPOSITORY/" \
            --dart-define="CMS=$CMS" \
            --dart-define="CMS_URL=$CMS_URL" \
            --dart-define="CMS_SPACE=$CMS_SPACE" \
            --dart-define="CMS_PROJECT=$CMS_PROJECT" \
            --dart-define="CMS_DATASET=${CMS_DATASET:-production}" \
            --dart-define="CMS_TOKEN=$CMS_TOKEN"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
